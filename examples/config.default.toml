profile = "balanced"
output_dir = "outputs"

[speech]
provider = "auto"
model = "base.en"
language = "en"
device = "auto"

[frames]
method = "scene_change"
scene_threshold = 0.15
fallback_interval_seconds = 10.0
max_resolution = 720

[ocr]
provider = "tesseract"
preprocess = true
confidence_threshold = 0.60
language = "eng"

[llm]
enabled = false
provider = "none"
temperature = 0.1

[output]
markdown = true
json = true
transcript = false
include_frame_links = true
