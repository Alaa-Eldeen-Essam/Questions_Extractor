profile = "balanced"
output_dir = "outputs"

[workflow]
id = "exam_study_pack"

[workflow.blocks.ocr]
enabled = true

[speech]
provider = "auto"
model = "base.en"
language = "auto"
device = "auto"
compute_type = "auto"
translate = false
beam_size = 5
vad_filter = true
timeout_seconds = 120.0
# remote_base_url = "http://localhost:8000/v1"
# remote_api_key_env = "OPENAI_API_KEY"

[frames]
method = "scene_change"
scene_threshold = 0.15
fallback_interval_seconds = 10.0
max_resolution = 720

[ocr]
provider = "tesseract"
preprocess = true
confidence_threshold = 0.60
language = "eng"

[llm]
enabled = false
provider = "none"
temperature = 0.1
max_tokens = 2048
timeout_seconds = 120.0
retry_count = 1
vision_enabled = true
output_language = "same"

[task]
kind = "auto"
instruction = ""
max_items = 100
include_evidence = true

[output]
markdown = true
json = true
transcript = false
word = true
include_frame_links = true

[privacy]
redact_source = false
# retention_days = 30

[review]
enabled = true
threshold = 0.70
gate_before_artifacts = false
